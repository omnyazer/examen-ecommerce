name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Installer les outils de qualité
        run: npm ci
      - name: Vérifier ESLint
        run: npm run lint
      - name: Vérifier Prettier
        run: npm run format:check
      - name: Tester les scripts de déploiement
        run: node --test scripts/*.test.mjs
      - name: Générer la documentation technique
        run: npm run docs
      - name: Conserver la documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation-api
          path: docs/api/
          retention-days: 3
      - name: Auditer les outils de qualité
        run: npm audit --audit-level=high

  frontend:
    name: Tests et compilation du frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Tester le frontend
        run: npm test
      - name: Compiler le frontend
        run: npm run build
      - name: Auditer les dépendances
        run: npm audit --audit-level=high
      - name: Conserver la compilation
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/build/
          if-no-files-found: error
          retention-days: 3

  backend:
    name: Tests du backend et des microservices
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      NOTIFICATIONS_ENABLED: 'false'
      RECOVERY_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      STOCK_TEST_MONGO_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            gateway/package-lock.json
            microservices/notifications/package-lock.json
            microservices/stock-management/package-lock.json
            microservices/auth-gateway/package-lock.json
      - name: Installer les dépendances serveur
        run: |
          for component in backend gateway microservices/notifications microservices/stock-management microservices/auth-gateway; do
            (cd "$component" && npm ci)
          done
      - name: Démarrer MongoDB pour les tests
        run: |
          uname -r
          docker run --detach --name ci-mongo --publish 127.0.0.1:27017:27017 mongo:8.0
          node --input-type=commonjs <<'NODE'
          const mongoose = require('./backend/node_modules/mongoose');
          const { execFileSync } = require('node:child_process');
          (async () => {
            const deadline = Date.now() + 120000;
            while (Date.now() < deadline) {
              try {
                await mongoose.connect(process.env.RECOVERY_TEST_MONGO_URI, { serverSelectionTimeoutMS: 2000 });
                await mongoose.connection.db.admin().ping();
                await mongoose.disconnect();
                console.log('MongoDB est prêt.');
                return;
              } catch (error) {
                await mongoose.disconnect();
                const running = execFileSync('docker', ['inspect', '--format', '{{.State.Running}}', 'ci-mongo'], { encoding: 'utf8' }).trim();
                if (running !== 'true') throw new Error('Le conteneur MongoDB est arrêté. Consultez ses journaux.');
                console.log(`Connexion MongoDB en attente : ${error.name}`);
                await new Promise(resolve => setTimeout(resolve, 2000));
              }
            }
            throw new Error('MongoDB ne répond pas après deux minutes.');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Tester le backend, les notifications et le stock
        run: >-
          node --test
          backend/tests/*.test.cjs
          microservices/notifications/tests/*.test.cjs
          microservices/stock-management/tests/*.test.cjs
      - name: Auditer les dépendances serveur
        run: |
          for component in backend gateway microservices/notifications microservices/stock-management microservices/auth-gateway; do
            (cd "$component" && npm audit --audit-level=high)
          done
      - name: Afficher les journaux MongoDB en cas d’échec
        if: failure()
        run: docker logs ci-mongo || true
      - name: Arrêter MongoDB de test
        if: always()
        run: docker rm --force ci-mongo || true

  images:
    name: Conteneur ${{ matrix.component.name }}
    needs: [quality, frontend, backend]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component:
          - { name: app, context: '.', file: Dockerfile }
          - { name: backend, context: backend, file: backend/Dockerfile }
          - { name: frontend, context: frontend, file: frontend/Dockerfile }
          - { name: gateway, context: gateway, file: gateway/Dockerfile }
          - {
              name: notifications,
              context: microservices/notifications,
              file: microservices/notifications/Dockerfile,
            }
          - {
              name: stock,
              context: microservices/stock-management,
              file: microservices/stock-management/Dockerfile,
            }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Construire l'image
        env:
          COMPONENT: ${{ matrix.component.name }}
          CONTEXT: ${{ matrix.component.context }}
          DOCKERFILE: ${{ matrix.component.file }}
        run: docker build --file "$DOCKERFILE" --tag "exam-$COMPONENT:$GITHUB_SHA" "$CONTEXT"
      - name: Publier sur GHCR
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'staging') && vars.ENABLE_IMAGE_PUBLISH == 'true'
        env:
          COMPONENT: ${{ matrix.component.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$COMPONENT:$GITHUB_SHA"
          docker tag "exam-$COMPONENT:$GITHUB_SHA" "$image"
          docker push "$image"

  deploy:
    name: Déployer sur Render
    needs: [quality, frontend, backend, images]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'staging') && vars.ENABLE_RENDER_CD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: ${{ github.ref_name == 'main' && 'production' || 'preproduction' }}
    concurrency:
      group: render-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
      - name: Déployer et attendre les services
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STOCK_HOOK: ${{ secrets.RENDER_STOCK_HOOK }}
          RENDER_NOTIFICATIONS_HOOK: ${{ secrets.RENDER_NOTIFICATIONS_HOOK }}
          RENDER_GATEWAY_HOOK: ${{ secrets.RENDER_GATEWAY_HOOK }}
          RENDER_APP_HOOK: ${{ secrets.RENDER_APP_HOOK }}
        run: node scripts/deploy-render.mjs
